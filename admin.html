<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة - كلية الإعلام</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-section {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            text-align: right;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        .badge-danger {
            background-color: #dc3545;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .badge-success {
            background-color: #28a745;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .btn-delete {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-delete:hover {
            background-color: #bd2130;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <h2>لوحة التحكم الشاملة للإدارة</h2>

        <!-- تسجيل دخول الإدارة -->
        <div id="adminLoginBox">
            <div class="input-group">
                <label>معرف الإدارة (ID):</label>
                <input type="text" id="adminId" placeholder="أدخل معرف الإدارة الخاص بك">
            </div>
            <div class="input-group">
                <label>كلمة السر:</label>
                <input type="password" id="adminPass" placeholder="أدخل كلمة السر">
            </div>
            <button type="button" onclick="loginAdmin()">دخول لوحة التحكم</button>
        </div>

        <!-- لوحة التحكم الشاملة -->
        <div id="adminDashboard" style="display: none;">
            
            <!-- 1. التحكم في وقت المحاضرة وإنشاء الحسابات -->
            <div class="admin-section">
                <h3>⏱️ إعدادات المحاضرة وحسابات الطلاب</h3>
                <p id="sessionStatusText" style="font-size:15px; font-weight:bold;"></p>
                <button type="button" id="toggleSessionBtn" onclick="toggleAttendanceSession()" style="width: auto; padding: 8px 15px; margin-bottom: 10px;"></button>
                <br>
                <p id="regStatusText" style="font-size:15px; font-weight:bold; margin-top: 10px;"></p>
                <button type="button" id="toggleRegBtn" onclick="toggleRegistrationState()" style="width: auto; padding: 8px 15px; background-color: #17a2b8;"></button>
                
                <div class="input-group" style="margin-top: 15px;">
                    <label>عنوان المحاضرة الحالية:</label>
                    <input type="text" id="lectureTitleInput" placeholder="مثال: المحاضرة الأولى - نشأة الاتصال">
                    <button type="button" onclick="saveLectureTitle()" style="background-color:#17a2b8; margin-top:5px; padding:8px;">حفظ العنوان</button>
                </div>
            </div>

            <!-- 2. إنشاء حساب يدوي لطالب بواسطة الإدارة -->
            <div class="admin-section">
                <h3>✍️ إنشاء حساب يدوي لطالب</h3>
                <div class="input-group">
                    <label>اسم الطالب:</label>
                    <input type="text" id="manualName" placeholder="أدخل اسم الطالب الكامل">
                </div>
                <div class="input-group">
                    <label>رقم الهاتف:</label>
                    <input type="text" id="manualPhone" placeholder="رقم الهاتف">
                </div>
                <div class="input-group">
                    <label>الفرقة الدراسية:</label>
                    <select id="manualGrade">
                        <option value="1">الفرقة الأولى</option>
                        <option value="2">الفرقة الثانية</option>
                        <option value="3">الفرقة الثالثة</option>
                        <option value="4">الفرقة الرابعة</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>كلمة السر الخاصة بالطالب:</label>
                    <input type="text" id="manualPassword" placeholder="كلمة السر">
                </div>
                <button type="button" onclick="createManualStudentAccount()" style="background-color: #28a745; padding: 8px;">إضافة وتوليد حساب للطالب</button>
            </div>

            <!-- 3. إدارة المواد والدكاترة -->
            <div class="admin-section">
                <h3>📚 إضافة وإدارة المواد الدراسية</h3>
                <div class="input-group">
                    <label>اسم المادة والدكتور:</label>
                    <input type="text" id="newSubjectInput" placeholder="مثال: صحافة إلكترونية - د. خالد">
                </div>
                <div class="input-group">
                    <label>تخصيص للفرقة:</label>
                    <select id="newSubjectGrade">
                        <option value="1">الفرقة الأولى</option>
                        <option value="2">الفرقة الثانية</option>
                        <option value="3">الفرقة الثالثة</option>
                        <option value="4">الفرقة الرابعة</option>
                    </select>
                </div>
                <button type="button" onclick="addNewSubject()" style="background-color: #28a745; padding: 8px;">إضافة المادة للمنصة</button>
            </div>

            <!-- 4. سجل الحضور الجاري للمحاضرة -->
            <div class="admin-section">
                <h3>📋 كشف الحضور الجاري للمحاضرة</h3>
                <button type="button" onclick="exportToExcel()" style="background-color: #28a745; margin-bottom: 8px;">📥 تصدير الكشف الحالي Excel (CSV)</button>
                <button type="button" onclick="clearCurrentAttendance()" style="background-color: #dc3545; margin-bottom: 12px;">🗑️ بدء محاضرة جديدة (مسح الكشف الحالي)</button>
                <div id="adminReportContainer" style="max-height:200px; overflow-y:auto;"></div>
            </div>

            <!-- 5. قاعدة بيانات الطلاب والإحصائيات الثابتة -->
            <div class="admin-section">
                <h3>👥 سجل جميع الطلاب وإجمالي الحضور</h3>
                <div style="display: flex; justify-content: space-between; gap: 10px; margin-bottom: 10px;">
                    <input type="text" id="searchStudentInput" onkeyup="filterStudents()" placeholder="🔍 ابحث باسم الطالب أو الـ ID..." style="flex: 1; margin: 0;">
                    <button type="button" onclick="deleteAllStudents()" style="background-color: #dc3545; width: auto; margin: 0; padding: 8px 12px; font-size: 13px;">🗑️ مسح كل الطلاب</button>
                </div>
                
                <div style="overflow-x: auto;">
                    <table id="studentsTable">
                        <thead>
                            <tr>
                                <th>الـ ID</th>
                                <th>اسم الطالب</th>
                                <th>الهاتف</th>
                                <th>الفرقة</th>
                                <th>كلمة السر</th>
                                <th>إجمالي الحضور</th>
                                <th>المخالفات</th>
                                <th>إجراءات الإدارة</th>
                            </tr>
                        </thead>
                        <tbody id="studentsTableBody">
                        </tbody>
                    </table>
                </div>
            </div>

            <button type="button" onclick="logoutAdmin()" style="background-color: #6c757d; margin-top: 15px;">تسجيل الخروج من الإدارة</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if(sessionStorage.getItem('isAdminLoggedIn') === 'true') {
                const loginBox = document.getElementById('adminLoginBox');
                const dashboard = document.getElementById('adminDashboard');
                if(loginBox) loginBox.style.display = 'none';
                if(dashboard) dashboard.style.display = 'block';
                loadAdminDashboard();
            }
        });

        function loginAdmin() {
            const idInput = document.getElementById('adminId');
            const passInput = document.getElementById('adminPass');
            
            if(!idInput || !passInput) return;

            const id = idInput.value.trim();
            const pass = passInput.value.trim();

            if (id === 'admin' && pass === '44554455') {
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                document.getElementById('adminLoginBox').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                loadAdminDashboard();
            } else {
                alert('بيانات دخول الإدارة غير صحيحة!');
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('isAdminLoggedIn');
            window.location.reload();
        }

        function loadAdminDashboard() {
            const isOpen = localStorage.getItem('isAttendanceOpen') === 'true';
            const statusText = document.getElementById('sessionStatusText');
            const toggleBtn = document.getElementById('toggleSessionBtn');

            if (statusText && toggleBtn) {
                if (isOpen) {
                    statusText.textContent = "🟢 التسجيل مفتوح للطلاب الآن";
                    statusText.style.color = "green";
                    toggleBtn.textContent = "إغلاق باب التسجيل";
                    toggleBtn.style.backgroundColor = "#dc3545";
                } else {
                    statusText.textContent = "🔴 التسجيل مغلق حالياً";
                    statusText.style.color = "red";
                    toggleBtn.textContent = "فتح باب التسجيل";
                    toggleBtn.style.backgroundColor = "#28a745";
                }
            }

            const isRegOpen = localStorage.getItem('isRegistrationOpen') !== 'false';
            const regStatusText = document.getElementById('regStatusText');
            const toggleRegBtn = document.getElementById('toggleRegBtn');

            if (regStatusText && toggleRegBtn) {
                if (isRegOpen) {
                    regStatusText.textContent = "🟢 إنشاء الحسابات متاح للطلاب الآن";
                    regStatusText.style.color = "green";
                    toggleRegBtn.textContent = "قفل إنشاء الحسابات";
                    toggleRegBtn.style.backgroundColor = "#dc3545";
                } else {
                    regStatusText.textContent = "🔴 إنشاء الحسابات مقفل من الإدارة";
                    regStatusText.style.color = "red";
                    toggleRegBtn.textContent = "فتح إنشاء الحسابات";
                    toggleRegBtn.style.backgroundColor = "#28a745";
                }
            }

            const titleInput = document.getElementById('lectureTitleInput');
            if(titleInput) titleInput.value = localStorage.getItem('currentLectureTitle') || "المحاضرة الأولى";

            renderAdminReport();
            renderStudentsDatabase();
        }

        function toggleAttendanceSession() {
            const isOpen = localStorage.getItem('isAttendanceOpen') === 'true';
            localStorage.setItem('isAttendanceOpen', !isOpen);
            loadAdminDashboard();
        }

        function toggleRegistrationState() {
            const isRegOpen = localStorage.getItem('isRegistrationOpen') !== 'false';
            localStorage.setItem('isRegistrationOpen', !isRegOpen);
            loadAdminDashboard();
        }

        function createManualStudentAccount() {
            const nameEl = document.getElementById('manualName');
            const phoneEl = document.getElementById('manualPhone');
            const gradeEl = document.getElementById('manualGrade');
            const passEl = document.getElementById('manualPassword');

            if (!nameEl || !phoneEl || !passEl) return;

            const name = nameEl.value.trim();
            const phone = phoneEl.value.trim();
            const grade = gradeEl.value;
            const password = passEl.value.trim();

            if (!name || !phone || !password) {
                alert("يرجى إكمال جميع بيانات الطالب اليدوية!");
                return;
            }

            const newId = 'AZ' + Math.floor(100000 + Math.random() * 900000);
            const userData = { 
                id: newId, 
                name: name, 
                phone: phone, 
                grade: grade, 
                password: password,
                isAdmin: false,
                totalAttendance: 0, 
                totalViolations: 0  
            };

            localStorage.setItem(newId, JSON.stringify(userData));
            alert(`✅ تم إنشاء حساب الطالب بنجاح!\n\n🆔 الرقم الجامعي (ID): ${newId}\nكلمة السر: ${password}`);
            
            nameEl.value = '';
            phoneEl.value = '';
            passEl.value = '';
            
            renderStudentsDatabase();
        }

        function saveLectureTitle() {
            const titleInput = document.getElementById('lectureTitleInput');
            if(!titleInput) return;
            const title = titleInput.value.trim();
            localStorage.setItem('currentLectureTitle', title);
            alert("تم حفظ عنوان المحاضرة!");
        }

        function addNewSubject() {
            const subInput = document.getElementById('newSubjectInput');
            const gradeInput = document.getElementById('newSubjectGrade');
            if(!subInput || !gradeInput) return;

            const subName = subInput.value.trim();
            const grade = gradeInput.value;

            if(!subName) {
                alert("يرجى كتابة اسم المادة والدكتور!");
                return;
            }

            let customSubjects = JSON.parse(localStorage.getItem('customSubjects')) || [];
            customSubjects.push({ grade: grade, title: subName });
            localStorage.setItem('customSubjects', JSON.stringify(customSubjects));

            alert(`تمت إضافة مادة "${subName}" بنجاح!`);
            subInput.value = '';
        }

        function renderAdminReport() {
            const records = JSON.parse(localStorage.getItem('allAttendanceRecords')) || [];
            const container = document.getElementById('adminReportContainer');

            if (!container) return;

            if (records.length === 0) {
                container.innerHTML = "<p style='text-align:center;'>لا يوجد حضور مسجل في هذه المحاضرة بعد.</p>";
                return;
            }

            let html = "<ol style='padding-right:20px;'>";
            records.forEach(r => {
                let statusTag = r.isOutlier ? 
                    `<span class="badge-danger">⚠️ موقع مشبوه</span>` : 
                    `<span class="badge-success">✅ داخل الجامعة</span>`;

                html += `<li style="margin-bottom: 8px;">
                    <strong>${r.name}</strong> (${r.id}) - ${r.time} - ${statusTag} 
                    | <a href="${r.locationLink}" target="_blank">الموقع</a>
                </li>`;
            });
            html += "</ol>";
            container.innerHTML = html;
        }

        function renderStudentsDatabase() {
            const tbody = document.getElementById('studentsTableBody');
            if (!tbody) return;
            tbody.innerHTML = '';

            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('AZ')) {
                    try {
                        const student = JSON.parse(localStorage.getItem(key));
                        if(student && student.id) {
                            const totalAttended = student.totalAttendance || 0;
                            const totalViolations = student.totalViolations || 0;
                            const isAdmin = student.isAdmin ? true : false;

                            const row = `<tr>
                                <td><strong>${student.id}</strong></td>
                                <td>${student.name} ${isAdmin ? '👑 (أدمن)' : ''}</td>
                                <td>${student.phone}</td>
                                <td>${student.grade}</td>
                                <td><code>${student.password}</code></td>
                                <td><span class="badge-success">${totalAttended} محاضرة</span></td>
                                <td>${totalViolations > 0 ? `<span class="badge-danger">${totalViolations} مخالفة</span>` : 'لا يوجد'}</td>
                                <td>
                                    <button type="button" onclick="toggleAdminRole('${student.id}')" style="background-color: ${isAdmin ? '#ffc107' : '#17a2b8'}; color: #000; border:none; padding:4px 8px; border-radius:4px; font-size:11px; cursor:pointer; margin-bottom: 2px;">
                                        ${isAdmin ? 'إلغاء الأدمن 👤' : 'ترقية لأدمن 👑'}
                                    </button>
                                    <button class="btn-delete" onclick="deleteStudent('${student.id}')">حذف 🗑️</button>
                                </td>
                            </tr>`;
                            tbody.innerHTML += row;
                        }
                    } catch(e) {}
                }
            }
        }

        function toggleAdminRole(studentId) {
            const studentData = localStorage.getItem(studentId);
            if (studentData) {
                let student = JSON.parse(studentData);
                student.isAdmin = !student.isAdmin;
                localStorage.setItem(studentId, JSON.stringify(student));
                alert(student.isAdmin ? `👑 تم إعطاء صلاحية الأدمن للحساب (${student.name}) - يمكنه الآن الدخول من أي جهاز بدون قيود!` : `👤 تم إزالة صلاحية الأدمن من الحساب.`);
                renderStudentsDatabase();
            }
        }

        function deleteStudent(studentId) {
            if (confirm(`هل أنت تأكد من حذف الطالب صاحب الرقم ${studentId}؟`)) {
                localStorage.removeItem(studentId);
                renderStudentsDatabase();
            }
        }

        function deleteAllStudents() {
            if (confirm("⚠️ هل أنت تأكد من مسح جميع حسابات الطلاب من النظام؟")) {
                let keysToRemove = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.startsWith('AZ')) {
                        keysToRemove.push(key);
                    }
                }
                keysToRemove.forEach(k => localStorage.removeItem(k));
                renderStudentsDatabase();
                alert("تم مسح جميع الطلاب بنجاح!");
            }
        }

        function filterStudents() {
            const inputEl = document.getElementById('searchStudentInput');
            if (!inputEl) return;
            const input = inputEl.value.toLowerCase();
            const rows = document.querySelectorAll('#studentsTableBody tr');

            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(input) ? '' : 'none';
            });
        }

        function clearCurrentAttendance() {
            if (confirm("⚠️ هل أنت تأكد من مسح كشف المحاضرة الحالية لبدء محاضرة جديدة؟")) {
                localStorage.removeItem('allAttendanceRecords');
                loadAdminDashboard();
                alert("تم مسح الكشف الحالي بنجاح!");
            }
        }

        function exportToExcel() {
            const records = JSON.parse(localStorage.getItem('allAttendanceRecords')) || [];
            if (records.length === 0) {
                alert("لا توجد بيانات حضور لتصديرها!");
                return;
            }

            const title = localStorage.getItem('currentLectureTitle') || "كشف الحضور";
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "الرقم الجامعي (ID),اسم الطالب,رقم التليفون,الفرقة,المادة,تاريخ ووقت الحضور,حالة الموقع,رابط الخريطة\n";

            records.forEach(r => {
                const status = r.isOutlier ? "موقع مشبوه (خارج الجامعة)" : "داخل الجامعة";
                csvContent += `"${r.id}","${r.name}","${r.phone}","${r.grade}","${r.subject}","${r.time}","${status}","${r.locationLink}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `${title}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
