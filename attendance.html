<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الحضور بالـ GPS - كلية الإعلام</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>تسجيل الحضور للمحاضرة</h2>
        <p id="userInfo" style="color: #6c757d; font-weight: bold; margin-bottom: 5px;"></p>
        <p id="attendanceSubject" style="font-weight: bold; color: #007bff; margin-bottom: 15px;"></p>
        
        <p id="lectureTitleDisplay" style="background:#e9ecef; padding:8px; border-radius:5px; font-weight:bold; font-size:14px;"></p>

        <div id="attendanceForm">
            <div class="input-group">
                <label>الكود السري للمحاضرة:</label>
                <input type="password" id="secretCode" placeholder="أدخل الكود السري الخاص بالدكتور">
            </div>

            <button type="button" onclick="submitFinalAttendance()">تسجيل الحضور عبر الـ GPS</button>
        </div>

        <p id="statusMsg"></p>

        <button type="button" onclick="goBack()" style="background-color: #6c757d; margin-top: 15px;">الرجوع لاختيار المواد</button>

        <hr style="margin-top: 20px; border: 0.5px solid #eee;">
        <a href="admin.html" style="font-size: 12px; color: #888; text-decoration: none;">🔐 لوحة تحكم الدكتور</a>
    </div>

    <script src="script.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('currentUser'));
        const subject = localStorage.getItem('selectedSubject');

        if(!user) {
            window.location.href = 'index.html';
        } else if(!subject) {
            window.location.href = 'subjects.html';
        } else {
            document.getElementById('userInfo').textContent = `الطالب: ${user.name} (ID: ${user.id})`;
            document.getElementById('attendanceSubject').textContent = `المادة: ${subject}`;
        }

        const lectureTitle = localStorage.getItem('currentLectureTitle') || "المحاضرة الأولى";
        document.getElementById('lectureTitleDisplay').textContent = `📌 ${lectureTitle}`;

        const isAttendanceOpen = localStorage.getItem('isAttendanceOpen') === 'true';
        if (!isAttendanceOpen) {
            document.getElementById('attendanceForm').style.display = 'none';
            document.getElementById('statusMsg').style.color = 'red';
            document.getElementById('statusMsg').textContent = '🔒 باب تسجيل الحضور مغلق حالياً بواسطة الدكتور.';
        }

        function goBack() {
            window.location.href = 'subjects.html';
        }
    </script>
</body>
</html>
